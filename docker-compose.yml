services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Match these to your host user so bind-mounted files stay writable.
        # On Linux run: id -u  /  id -g
        USER_UID: "1000"
        USER_GID: "1000"
    container_name: dev-env
    init: true
    volumes:
      # Your code
      - .:/workspace:cached
      # Host Docker daemon — required for `supabase start`
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist database + cache data across container rebuilds
      - pgdata:/var/lib/postgresql
      - redisdata:/var/lib/redis
      # Persist package caches so rebuilds are fast
      - cargo-registry:/usr/local/cargo/registry
      - npm-cache:/home/devdre/.npm
      - supabase-cli:/home/devdre/.supabase
    extra_hosts:
      # Lets the container reach ports the Supabase stack publishes on the host
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"   # Next.js / React dev server
      - "3001:3001"
      - "5173:5173"   # Vite
      - "8000:8000"   # Python (FastAPI/Django)
      - "8080:8080"   # Java (Spring Boot)
      - "5432:5432"   # PostgreSQL (the one inside this container)
      - "6379:6379"   # Redis
    command: sleep infinity

volumes:
  pgdata:
  redisdata:
  cargo-registry:
  npm-cache:
  supabase-cli:
